# =============================================
# CARPINCHILL - Configuración de la aplicación
# =============================================

# Puerto del servidor (Render usa la variable PORT)
server.port=${PORT:8080}

# ---- BASE DE DATOS H2 (en memoria) ----
# H2 no necesita instalación, todo funciona automáticamente
spring.datasource.url=jdbc:h2:mem:carpinchill;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# create-drop: crea las tablas al iniciar y las borra al parar
# Esto es perfecto para desarrollo con H2
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- CONSOLA H2 (para ver la BD en el navegador) ----
# Acceder en: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- NOMBRE DE LA APP ----
spring.application.name=carpinchill-backend

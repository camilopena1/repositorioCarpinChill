# =============================================
# CARPINCHILL - Configuración completa
# =============================================

server.port=${PORT:8080}
server.address=0.0.0.0

# ---- BASE DE DATOS ----
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:carpinchill;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console

# ---- JWT ----
jwt.secret=${JWT_SECRET:carpinchill-secret-key-development-only}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ---- OPENWEATHERMAP ----
openweather.api.key=${OPENWEATHER_API_KEY:}
openweather.api.url=https://api.openweathermap.org/data/2.5

# ---- EMAIL (Gmail) ----
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
carpinchill.mail.from=${MAIL_USERNAME:noreply@carpinchill.com}

spring.application.name=carpinchill-backend
spring.main.allow-circular-references=true
